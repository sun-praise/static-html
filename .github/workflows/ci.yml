name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run pytest
    runs-on: self-hosted
    steps:
      - name: Clean corrupted git objects
        run: |
          if [ -d .git/objects ]; then
            find .git/objects -type f -empty -delete 2>/dev/null || true
            git fsck --unreachable 2>/dev/null | grep -oP '(?<=missing )\w+' | while read sha; do
              obj_path=".git/objects/${sha:0:2}/${sha:2}"
              rm -f "$obj_path" 2>/dev/null || true
            done
          fi

      - name: Clean Python bytecode cache
        run: |
          find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true
          find . -name "*.pyo" -delete 2>/dev/null || true
          rm -rf build/ *.egg-info 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip uninstall ralphplus -y 2>/dev/null || true
          python -m pip install -e ".[dashboard,test]"

      - name: Build frontend
        run: |
          pnpm install --dir frontend
          pnpm --dir frontend build

      - name: Run regression tests
        env:
          PYTHONDONTWRITEBYTECODE: 1
        run: pytest -q

  go:
    name: Go build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build -o /tmp/ralphplus ./cmd/ralphplus

      - name: Go test
        run: go test ./...

  deepseek-integration:
    name: Run DeepSeek integration test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Ensure DeepSeek API key is configured
        run: |
          test -n "$DEEPSEEK_API_KEY"

      - name: Run DeepSeek integration test
        run: pytest -q tests/test_comment_classifier_integration.py
