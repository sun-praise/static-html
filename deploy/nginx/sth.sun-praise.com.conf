# nginx server block for sth.sun-praise.com
#
# Symlink into the host nginx's site-enabled directory:
#   ln -s /opt/sth/deploy/nginx/sth.sun-praise.com.conf /etc/nginx/sites-enabled/sth.sun-praise.com.conf
#   nginx -t && systemctl reload nginx
#
# Assumes the host has certbot (or another ACME client) writing certs to:
#   /etc/letsencrypt/live/sth.sun-praise.com/fullchain.pem
#   /etc/letsencrypt/live/sth.sun-praise.com/privkey.pem
#
# Reverse proxy target is the docker-compose `app` service, listening on
# 127.0.0.1:3939 (see docker-compose.yml).

# ---- HTTP -> HTTPS redirect ----------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name sth.sun-praise.com;

    # ACME http-01 challenge must remain reachable on plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS reverse proxy ------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sth.sun-praise.com;

    ssl_certificate     /etc/letsencrypt/live/sth.sun-praise.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sth.sun-praise.com/privkey.pem;

    # Sensible TLS defaults (modern profile)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — 6 months, include subdomains. Lift `preload` once you're sure.
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upload body cap (matches server's 64 MiB archive limit with headroom)
    client_max_body_size 128m;

    # ---- logging ---------------------------------------------------------
    access_log /var/log/nginx/sth.sun-praise.com.access.log;
    error_log  /var/log/nginx/sth.sun-praise.com.error.log warn;

    # ---- reverse proxy ---------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3939;

        # Preserve client info for the upstream.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket support (live-reload at /s/<id>/ws).
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Long-lived connections (1 day) so live-reload sockets aren't cut
        # by nginx's default 60s idle timeout.
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_connect_timeout 10s;

        # Don't buffer streaming responses (WebSocket, SSE).
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

# Map used by the WebSocket handshake above.
# `upgrade` matches `Connection: upgrade`; the default `close` covers
# all other requests, preserving HTTP/1.1 keep-alive for normal traffic.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
